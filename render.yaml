services:
  - type: web
    name: tiny-tactics-server
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm --workspace=@tiny-tactics/server run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_ORIGIN
        value: "*"
